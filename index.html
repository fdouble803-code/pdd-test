<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПДД Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }
        /* ЭКРАН МЕНЮ */
        #menu-container { display: block; padding: 10px; }
        #menu-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        #tickets-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); /* По 4 кнопки в ряд */
            gap: 12px; 
            margin-top: 20px; 
        }
        .ticket-btn { 
            background-color: #2c2c2e; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            padding: 20px 0; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.1s; 
        }
        .ticket-btn:active { transform: scale(0.92); background-color: #3a3a3c; }

        /* ЭКРАН ТЕСТА */
        #quiz-container { display: none; }
        #ticket-info { font-size: 15px; color: #8e8e93; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; }
        #question-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; }
        #question-img { max-width: 100%; max-height: 250px; height: auto; border-radius: 12px; margin: 15px auto; display: none; }
        
        /* КНОПКИ ОТВЕТОВ И УПРАВЛЕНИЯ */
        .btn { display: block; width: 100%; margin: 12px 0; padding: 16px; background-color: #2c2c2e; color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; font-weight: 500; text-align: center; }
        .btn:disabled { color: white; opacity: 1; }
        
        /* ЭКРАН РЕЗУЛЬТАТОВ */
        #result-container { display: none; padding: 30px 10px; }
        #result-title { font-size: 26px; font-weight: bold; margin-bottom: 30px; }
        .stat-box { font-size: 20px; margin: 15px 0; padding: 15px; border-radius: 12px; font-weight: bold; }
        .stat-correct { background-color: rgba(52, 199, 89, 0.2); color: #34c759; }
        .stat-incorrect { background-color: rgba(255, 59, 48, 0.2); color: #ff3b30; }
        #next-ticket-btn { background-color: #007aff; margin-top: 30px; }
        #home-btn { background-color: #ff9500; margin-top: 10px; } /* Оранжевая кнопка домой */
    </style>

    <script>
        window.onerror = function(message, source, lineno) {
            var errDiv = document.getElementById("menu-title");
            if (errDiv) {
                errDiv.style.color = "#ff3b30";
                errDiv.innerHTML = "<b>Xato:</b><br>" + message;
            }
            return false;
        };
        function handleScriptError(scriptName) {
            var errDiv = document.getElementById("menu-title");
            if (errDiv) {
                errDiv.style.color = "#ff3b30";
                errDiv.innerHTML = "<b>Файл topilmadi:</b> " + scriptName;
            }
        }
    </script>
</head>
<body>

    <div id="menu-container">
        <div id="menu-title">Biletni tanlang</div>
        <div id="tickets-grid">
            </div>
    </div>

    <div id="quiz-container">
        <div id="ticket-info">Yuklanmoqda...</div>
        <div id="question-text">Savol yuklanmoqda...</div>
        <img id="question-img" src="" alt="Rasm">
        <div id="options-container"></div>
    </div>

    <div id="result-container">
        <div id="result-title">Bilet yakunlandi!</div>
        <div class="stat-box stat-correct" id="correct-stat">To'g'ri: 0</div>
        <div class="stat-box stat-incorrect" id="incorrect-stat">Noto'g'ri: 0</div>
        
        <button id="next-ticket-btn" class="btn">Keyingi bilet →</button>
        <button id="home-btn" class="btn">🏠 Bosh menyu</button>
    </div>

    <script src="data.js" onerror="handleScriptError('data.js')"></script>
    <script src="script.js" onerror="handleScriptError('script.js')"></script>
</body>
</html>
