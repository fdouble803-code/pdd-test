<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПДД Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }
        #quiz-container { display: block; }
        #ticket-info { font-size: 15px; color: #8e8e93; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; }
        #question-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; }
        #question-img { max-width: 100%; max-height: 250px; height: auto; border-radius: 12px; margin: 15px auto; display: none; }
        .btn { display: block; width: 100%; margin: 12px 0; padding: 16px; background-color: #2c2c2e; color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; font-weight: 500; text-align: center; }
        .btn:disabled { color: white; opacity: 1; }
        #result-container { display: none; padding: 30px 10px; }
        #result-title { font-size: 26px; font-weight: bold; margin-bottom: 30px; }
        .stat-box { font-size: 20px; margin: 15px 0; padding: 15px; border-radius: 12px; font-weight: bold; }
        .stat-correct { background-color: rgba(52, 199, 89, 0.2); color: #34c759; }
        .stat-incorrect { background-color: rgba(255, 59, 48, 0.2); color: #ff3b30; }
        #next-ticket-btn { background-color: #007aff; margin-top: 40px; }
    </style>

    <!-- ЭКСТРЕННЫЙ СКРИПТ ОТЛОВЛИ ОШИБОК -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            var errDiv = document.getElementById("question-text");
            if (errDiv) {
                errDiv.style.color = "#ff3b30";
                errDiv.innerHTML = "<b>Критическая ошибка скрипта:</b><br>" + message + "<br><small>Файл: " + source + " | Строка: " + lineno + "</small>";
            }
            return false;
        };
        function handleScriptError(scriptName) {
            var errDiv = document.getElementById("question-text");
            if (errDiv) {
                errDiv.style.color = "#ff3b30";
                errDiv.innerHTML = "<b>Ошибка сети (404):</b> Не удалось загрузить файл <u>" + scriptName + "</u>.<br>Проверьте, что он лежит в той же папке на GitHub и имя написано маленькими буквами!";
            }
        }
    </script>
</head>
<body>

    <!-- ЭКРАН ТЕСТА -->
    <div id="quiz-container">
        <div id="ticket-info">Инициализация системы...</div>
        <div id="question-text">Загрузка вопроса...</div>
        <img id="question-img" src="" alt="Регулировщик/Знак">
        <div id="options-container"></div>
    </div>

    <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
    <div id="result-container">
        <div id="result-title">Bilet yakunlandi!</div>
        <div class="stat-box stat-correct" id="correct-stat">To'g'ri: 0</div>
        <div class="stat-box stat-incorrect" id="incorrect-stat">Noto'g'ri: 0</div>
        <button id="next-ticket-btn" class="btn">Keyingi bilet →</button>
    </div>

    <!-- Загрузка скриптов с датчиками ошибок -->
    <script src="data.js" onerror="handleScriptError('data.js')"></script>
    <script src="script.js" onerror="handleScriptError('script.js')"></script>
</body>
</html>
