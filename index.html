        #tickets-grid {
            display: grid;

            padding: 15px 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }
        .ticket-btn:active {

        }
    </style>
</head>
