<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHQ Imtihon Testlari</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 24px;
            margin-top: 0;
            text-align: center;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .grid-tickets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        .ticket-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 18px 10px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .ticket-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .back-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #334155;
        }

        .progress-text {
            font-size: 15px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .question-text {
            font-size: 19px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .image-container {
            text-align: center;
            margin-bottom: 25px;
            background: #111827;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid var(--border-color);
        }

        .image-container img {
            max-width: 100%;
            max-height: 260px;
            border-radius: 8px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #334155;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 10px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            line-height: 1.4;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #475569;
            border-color: #64748b;
            padding-left: 22px;
        }

        @media (max-width: 480px) {
            .grid-tickets {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="container" id="ticket-screen">
    <h2>Biletni tanlang</h2>
    <div class="grid-tickets" id="tickets-grid">
        </div>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="quiz-header">
        <button class="back-btn" onclick="showTicketScreen()">← Biletlar</button>
        <span class="progress-text" id="progress-info">Savol: 1 / 20</span>
    </div>
    <div class="question-text" id="question-box"></div>
    <div class="image-container" id="image-box"></div>
    <div class="options-list" id="options-box"></div>
</div>

<script src="script.js"></script>
</body>
</html>
