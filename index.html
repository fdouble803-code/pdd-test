<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПДД Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        #question-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        #question-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 15px auto;
        }
        .btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            background-color: #2c2c2e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="question-text">Загрузка вопроса...</div>
    <img id="question-img" src="" style="display:none;">
    <div id="options-container"></div>

    <script src="allTickets.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
