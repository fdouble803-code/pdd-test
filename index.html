<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDD Test</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* Основные стили страницы */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1424; /* Темно-синий фон как на скриншоте */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
        }

        #app {
            width: 100%;
            max-width: 600px; /* Ограничение ширины для десктопа */
            padding: 20px;
            box-sizing: border-box;
        }

        /* Меню выбора билетов */
        #tickets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .ticket-btn {
            background-color: #2481cc; /* Синий цвет кнопок */
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .ticket-btn:active { background-color: #1a5c91; }

        /* Экраны квиза и результатов скрыты по умолчанию */
        #quiz-container, #result-container { display: none; }

        /* Панель информации вопроса (таймер и номер) */
        #quiz-info-bar { margin-bottom: 15px; }
        #timer { font-size: 18px; float: right; }
        #ticket-info { font-size: 16px; opacity: 0.8; }

        /* Текст вопроса */
        #question-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Картинка вопроса */
        #question-img {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none; /* Скрыта, если нет изображения */
        }

        /* Контейнер ответов */
        #options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Обычная кнопка ответа */
        .option-btn {
            background-color: #1e3a5f; /* Темно-синий фон ответа */
            color: white;
            border: 1px solid #2e5a90; /* Легкая граница */
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        /* Эффект при наведении (только если кнопка активна) */
        .option-btn:not(.disabled):hover { background-color: #2e5a90; }

        /* КЛАССЫ ДЛЯ ПОДСВЕТКИ */
        
        /* 1. Класс disabled: применяется ко всем кнопкам после клика, отключает нажатия */
        .option-btn
