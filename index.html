<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПДД Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            -webkit-user-select: none; /* Отключаем выделение текста */
            user-select: none;
        }
        #question-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        #question-img {
            max-width: 100%;
            max-height: 250px;
            height: auto;
            border-radius: 12px;
            margin: 15px auto;
            display: none;
        }
        .btn {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 16px;
            background-color: #2c2c2e;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.99);
        }
        /* Стили для заблокированных кнопок, чтобы они не становились тусклыми */
        .btn:disabled {
            color: white;
            opacity: 1;
            cursor: default;
        }
    </style>
</head>
<body>

    <div id="question-text">Загрузка вопроса...</div>
    <img id="question-img" src="" alt="Регулировщик/Знак">
    <div id="options-container"></div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
