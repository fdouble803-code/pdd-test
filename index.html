<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHQ Imtihon Testlari</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #334155;
            --correct-color: #10b981;
            --wrong-color: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-wrapper {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-header {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
        }

        .stats-box {
            display: flex;
            gap: 15px;
        }

        .stat-correct { color: var(--correct-color); }
        .stat-wrong { color: var(--wrong-color); }
        .timer-box { color: #f59e0b; }

        .tickets-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .tickets-panel::-webkit-scrollbar {
            height: 6px;
        }
        .tickets-panel::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .ticket-tab {
            background: #334155;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .ticket-tab.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }

        .content-layout {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 15px;
        }

        .questions-sidebar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: fit-content;
        }

        .q-num-btn {
            background: #334155;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 0;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .q-num-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .image-box {
            text-align: center;
            background: #111827;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .image-box img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
            object-fit: contain;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            background: #334155;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            line-height: 1.4;
            transition: all 0.15s ease;
        }

        .option-item:hover:not(:disabled) {
            background: #475569;
            border-color: #64748b;
        }

        .option-item:disabled {
            cursor: not-allowed;
        }

        @media (max-width: 650px) {
            .content-layout {
                grid-template-columns: 1fr;
            }
            .questions-sidebar {
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
            }
            .q-num-btn {
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="info-header">
        <div class="timer-box" id="timer-display">Vaqt: 20:00</div>
        <div class="stats-box">
            <span class="stat-correct" id="correct-display">To'g'ri: 0</span>
            <span class="stat-wrong" id="incorrect-display">Noto'g'ri: 0</span>
        </div>
    </div>

    <div class="tickets-panel" id="tickets-tabs-container"></div>

    <div class="content-layout">
        <div class="questions-sidebar" id="questions-nums-container"></div>

        <div class="quiz-card">
            <div class="question-title" id="question-text-box">Yuklanmoqda...</div>
            <div class="image-box" id="question-image-box"></div>
            <div class="options-container" id="question-options-box"></div>
        </div>
    </div>
</div>
