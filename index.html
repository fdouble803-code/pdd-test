<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YHQ Imtihon Testlari</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #334155;
            --correct-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-wrapper {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Tepadagi biletlar paneli */
        .tickets-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .ticket-tab {
            background: #334155;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .ticket-tab.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Pastki asosiy qism: Chap panel va O'rtadagi savol */
        .content-layout {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 15px;
        }

        /* Chap tomondagi 1-20 savollar paneli */
        .questions-sidebar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: fit-content;
        }

        .q-num-btn {
            background: #334155;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 0;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .q-num-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* O'rtadagi savol va variantlar kartasi */
        .quiz-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .image-box {
            text-align: center;
            background: #111827;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .image-box img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 6px;
        }

            display: flex
